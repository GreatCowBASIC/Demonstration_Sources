<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mTouch Monitor</title>
<!--
  mTouch Monitor - a replacement for Microchip's mTouch One-Way GUI.

  Reads the mTouch one-way serial format from a COM port (Web Serial: Chrome or Edge) and shows each pad's state,
  value and delta, with a live graph. Open this file in Chrome or Edge, press Connect and choose the port.

  The line format (mTouch Framework mComm.c, and the PIC18/PIC24 mTouch Library MTouchDebugLog...):
      state mask , toggle mask , slider , value pad 0 , value pad 1 , ... CR LF
  Fields may be zero-padded, separated by ',' or ';'. Bit n of the state mask is set while pad n is pressed.
  Sent by GCBASIC_mTouch_Framework_CVD_8Buttons_Serial_16F1937.gcb with SERIAL_MTOUCH_GUI 1 (115200 baud).

  Pads are labelled as on the 8-button sensor board: sensor 0-7 = pad 8, 9, A, B, C, D, E, F (PAD_LABELS).

  Version 1.02 - the GCBASIC logo shows at start until the first click or key
-->
<style>
:root {
  color-scheme: light;
  --surface-0: #f3f2ef;
  --surface-1: #fcfcfb;
  --surface-2: #ecebe7;
  --border: #d9d8d2;
  --grid: #e6e5e0;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7973;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --pressed-bg: #e9f1fb;
  --critical: #c83a3a;
  --good: #1f7a3a;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #252523;
    --border: #353532;
    --grid: #2b2b29;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --pressed-bg: #1c2a3c;
    --critical: #e66767;
    --good: #4fb56d;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --surface-2: #252523;
  --border: #353532;
  --grid: #2b2b29;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --accent: #3987e5;
  --accent-ink: #ffffff;
  --pressed-bg: #1c2a3c;
  --critical: #e66767;
  --good: #4fb56d;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface-0);
  color: var(--text-primary);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
.status { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
.dot.on { background: var(--good); }
.dot.err { background: var(--critical); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
button, select {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--text-muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.active { background: var(--critical); border-color: var(--critical); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
label.inline { color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
.pad {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  cursor: pointer; user-select: none; text-align: left; font: inherit; color: inherit;
}
.pad.pressed { background: var(--pressed-bg); border-color: var(--accent); }
.pad.hidden { opacity: .45; }
.pad .top { display: flex; align-items: center; gap: 6px; }
.pad .swatch { width: 12px; height: 3px; border-radius: 2px; }
.pad .name { font-weight: 600; }
.pad .state { margin-left: auto; font-size: 12px; color: var(--text-muted); }
.pad.pressed .state { color: var(--accent); font-weight: 600; }
.pad .delta { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.pad .meta { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.chart-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 8px; }
.chart-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
.chart-head .hint { color: var(--text-muted); font-size: 12px; }
.chart-head .controls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.chart-wrap { position: relative; height: 340px; }
canvas { width: 100%; height: 100%; display: block; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; font-variant-numeric: tabular-nums; display: none;
  white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip .sw { width: 10px; height: 3px; border-radius: 2px; }
footer { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; color: var(--text-muted); font-size: 12px; }
footer code { color: var(--text-secondary); word-break: break-all; }
.notice { background: var(--surface-1); border: 1px solid var(--critical); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: none; }
/* Start-up splash: the GCBASIC logo until the first click or key */
.splash {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; background: var(--surface-0); cursor: pointer; text-align: center;
  padding: 16px; transition: opacity .3s;
}
.splash.gone { opacity: 0; pointer-events: none; }
.splash img { width: 150px; height: 150px; }
.splash .brand { font-size: 28px; font-weight: 700; letter-spacing: .02em; }
.splash .app { font-size: 16px; color: var(--text-secondary); }
.splash .go { margin-top: 12px; font-size: 13px; color: var(--text-muted); }
@media (max-width: 600px) {
  .toolbar { margin-left: 0; }
  .chart-wrap { height: 260px; }
}
</style>
</head>

  <div class="brand">GCBASIC</div>
  <div class="app">mTouch Monitor</div>
  <div class="go">Click anywhere or press a key to start</div>
</div>
<main>
  <header>
    <h1>mTouch Monitor</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Not connected</span></div>
    <div class="toolbar">
      <label class="inline">Baud
        <select id="baud">
          <option>9600</option><option>19200</option><option>38400</option><option>57600</option>
          <option selected>115200</option>
        </select>
      </label>
      <button class="primary" id="connect">Connect</button>
      <button id="zero" title="Take each pad's current value as its baseline">Zero</button>
      <button id="record" title="Record lines for a CSV file">Record</button>
      <button id="save" disabled>Save CSV</button>
      <button id="theme" title="Light / dark">Theme</button>
    </div>
  </header>

  <div class="notice" id="notice"></div>

  <section class="pads" id="pads" aria-label="Pads"></section>

  <section class="card">
    <div class="chart-head">
      <h2 id="chartTitle">Delta from baseline</h2>
      <span class="hint">Click a pad to show or hide its line</span>
      <div class="controls">
        <select id="mode" aria-label="Graph values">
          <option value="delta" selected>Delta</option>
          <option value="raw">Raw value</option>
        </select>
        <select id="span" aria-label="Time span">
          <option value="5">5 s</option>
          <option value="10" selected>10 s</option>
          <option value="30">30 s</option>
          <option value="60">60 s</option>
        </select>
        <button id="pause">Pause</button>
      </div>
    </div>
    <div class="chart-wrap" id="wrap">
      <canvas id="chart" role="img" aria-label="Live graph of each pad's value over time"></canvas>
      <div class="tip" id="tip"></div>
    </div>
  </section>

  <footer>
    <span id="rate">0 lines/s</span>
    <span id="count">0 lines</span>
    <span id="bad">0 ignored</span>
    <span>Last line: <code id="last">-</code></span>
  </footer>
</main>

<script>
(() => {
  "use strict";
  const MAX_PADS = 12;
  // The pad labels on the 8-button sensor board (02-02094): sensor 0 is pad 8 ... sensor 7 is pad F
  const PAD_LABELS = ["8", "9", "A", "B", "C", "D", "E", "F"];
  const padLabel = i => i < PAD_LABELS.length ? PAD_LABELS[i] : String(i);
  const BASELINE_LINES = 20;
  const HISTORY_MS = 65000;

  const $ = id => document.getElementById(id);
  const ui = {
    dot: $("dot"), status: $("status"), baud: $("baud"), connect: $("connect"), zero: $("zero"),
    record: $("record"), save: $("save"), theme: $("theme"), notice: $("notice"), pads: $("pads"),
    mode: $("mode"), span: $("span"), pause: $("pause"), chart: $("chart"), wrap: $("wrap"), tip: $("tip"),
    chartTitle: $("chartTitle"), rate: $("rate"), count: $("count"), bad: $("bad"), last: $("last")
  };

  // ---- State
  let padCount = 8;
  let samples = [];                  // { t, mask, values[] }
  let baseline = new Array(MAX_PADS).fill(null);
  let baseAcc = null;                // collecting the baseline: { n, sums[] }
  let minSeen = new Array(MAX_PADS).fill(Infinity);
  let maxSeen = new Array(MAX_PADS).fill(-Infinity);
  let visible = new Array(MAX_PADS).fill(true);
  let lineCount = 0, badCount = 0, rateCount = 0;
  let recording = false, recorded = [];
  let paused = false, pausedAt = 0;
  let port = null, reader = null, keepReading = false;
  let hoverX = null;

  function seriesColor(i) {
    return getComputedStyle(document.documentElement).getPropertyValue("--series-" + ((i % 8) + 1)).trim();
  }
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // ---- Pads
  const padEls = [];
  function buildPads() {
    ui.pads.innerHTML = "";
    padEls.length = 0;
    for (let i = 0; i < padCount; i++) {
      const b = document.createElement("button");
      b.className = "pad" + (visible[i] ? "" : " hidden");
      b.setAttribute("aria-pressed", "false");
      b.innerHTML =
        '<div class="top"><span class="swatch"></span><span class="name">Pad ' + padLabel(i) + '</span>' +
        '<span class="state">-</span></div>' +
        '<div class="delta">-</div>' +
        '<div class="meta">value <span class="v">-</span></div>' +
        '<div class="meta">min <span class="mn">-</span> max <span class="mx">-</span></div>';
      b.querySelector(".swatch").style.background = seriesColor(i);
      b.addEventListener("click", () => {
        visible[i] = !visible[i];
        b.classList.toggle("hidden", !visible[i]);
      });
      ui.pads.appendChild(b);
      padEls.push({
        root: b, state: b.querySelector(".state"), delta: b.querySelector(".delta"),
        v: b.querySelector(".v"), mn: b.querySelector(".mn"), mx: b.querySelector(".mx")
      });
    }
  }

  function updatePads() {
    const s = samples[samples.length - 1];
    if (!s) return;
    for (let i = 0; i < padCount; i++) {
      const el = padEls[i];
      const pressed = ((s.mask >> i) & 1) === 1;
      const v = s.values[i];
      el.root.classList.toggle("pressed", pressed);
      el.root.setAttribute("aria-pressed", pressed ? "true" : "false");
      el.state.textContent = pressed ? "Pressed" : (baseline[i] === null ? "Learning" : "Released");
      el.v.textContent = v === undefined ? "-" : v;
      el.delta.textContent = baseline[i] === null || v === undefined ? "-" : signed(v - baseline[i]);
      el.mn.textContent = isFinite(minSeen[i]) ? minSeen[i] : "-";
      el.mx.textContent = isFinite(maxSeen[i]) ? maxSeen[i] : "-";
    }
  }
  function signed(n) { return (n > 0 ? "+" : "") + n; }

  // ---- Parsing
  function handleLine(text) {
    const line = text.trim();
    if (!line) return;
    const fields = line.split(/[,;]/).map(f => f.trim()).filter(f => f.length);
    if (fields.length < 4 || !fields.every(f => /^\d+$/.test(f))) {
      badCount++;
      return;
    }
    const nums = fields.map(f => parseInt(f, 10));
    const values = nums.slice(3, 3 + MAX_PADS);
    if (values.length !== padCount) {
      padCount = values.length;
      buildPads();
    }
    const t = performance.now();
    samples.push({ t, mask: nums[0], values });
    while (samples.length && t - samples[0].t > HISTORY_MS) samples.shift();
    lineCount++;
    rateCount++;
    ui.last.textContent = line;

    for (let i = 0; i < values.length; i++) {
      if (values[i] < minSeen[i]) minSeen[i] = values[i];
      if (values[i] > maxSeen[i]) maxSeen[i] = values[i];
    }
    // The baseline: the average of the first BASELINE_LINES lines (again after Zero)
    if (baseline[0] === null && baseAcc === null) baseAcc = { n: 0, sums: new Array(MAX_PADS).fill(0) };
    if (baseAcc) {
      for (let i = 0; i < values.length; i++) baseAcc.sums[i] += values[i];
      baseAcc.n++;
      if (baseAcc.n >= BASELINE_LINES) {
        for (let i = 0; i < values.length; i++) baseline[i] = Math.round(baseAcc.sums[i] / baseAcc.n);
        baseAcc = null;
        minSeen.fill(Infinity);
        maxSeen.fill(-Infinity);
      }
    }
    if (recording) recorded.push([new Date().toISOString(), nums[0]].concat(values));
    updatePads();
  }

  // Lets the page be tried without a board: mTouchFeed("00001,00000,000,08190,...")
  window.mTouchFeed = handleLine;

  // ---- Serial
  async function connect() {
    if (!("serial" in navigator)) {
      showNotice("This browser has no Web Serial. Open the page in Chrome or Edge (version 89 or later).");
      return;
    }
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: parseInt(ui.baud.value, 10) });
    } catch (e) {
      port = null;
      if (e && e.name === "NotFoundError") return;   // no port chosen
      setStatus("err", "Could not open the port: " + (e && e.message ? e.message : e) +
        " - is another program (a terminal) using it?");
      return;
    }
    hideNotice();
    setStatus("on", "Connected at " + ui.baud.value + " baud");
    ui.connect.textContent = "Disconnect";
    ui.connect.classList.remove("primary");
    ui.baud.disabled = true;
    keepReading = true;
    readLoop();
  }

  async function readLoop() {
    const decoder = new TextDecoder();
    let buffer = "";
    while (port && port.readable && keepReading) {
      reader = port.readable.getReader();
      try {
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buffer.search(/[\r\n]/)) >= 0) {
            handleLine(buffer.slice(0, nl));
            buffer = buffer.slice(nl + 1);
          }
          if (buffer.length > 1000) buffer = "";
        }
      } catch (e) {
        if (keepReading) setStatus("err", "Read error: " + (e && e.message ? e.message : e));
      } finally {
        reader.releaseLock();
        reader = null;
      }
    }
  }

  async function disconnect() {
    keepReading = false;
    try { if (reader) await reader.cancel(); } catch (e) { }
    try { if (port) await port.close(); } catch (e) { }
    port = null;
    setStatus("", "Not connected");
    ui.connect.textContent = "Connect";
    ui.connect.classList.add("primary");
    ui.baud.disabled = false;
  }

  function setStatus(kind, text) {
    ui.dot.className = "dot" + (kind ? " " + kind : "");
    ui.status.textContent = text;
  }
  function showNotice(text) { ui.notice.textContent = text; ui.notice.style.display = "block"; }
  function hideNotice() { ui.notice.style.display = "none"; }

  // ---- Graph
  const ctx = ui.chart.getContext("2d");
  const PAD = { l: 56, r: 12, t: 10, b: 26 };

  function plotValue(s, i) {
    const v = s.values[i];
    if (v === undefined) return null;
    if (ui.mode.value === "raw") return v;
    return baseline[i] === null ? null : v - baseline[i];
  }

  function niceStep(range, target) {
    const raw = range / target;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = ui.wrap.clientWidth, h = ui.wrap.clientHeight;
    if (ui.chart.width !== Math.round(w * dpr) || ui.chart.height !== Math.round(h * dpr)) {
      ui.chart.width = Math.round(w * dpr);
      ui.chart.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const now = paused ? pausedAt : performance.now();
    const spanMs = parseInt(ui.span.value, 10) * 1000;
    const t0 = now - spanMs;
    const view = samples.filter(s => s.t >= t0 - 200 && s.t <= now);

    // Y range over the visible lines
    let lo = Infinity, hi = -Infinity;
    for (const s of view) for (let i = 0; i < padCount; i++) {
      if (!visible[i]) continue;
      const v = plotValue(s, i);
      if (v === null) continue;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
    if (!isFinite(lo)) { lo = 0; hi = 100; }
    if (ui.mode.value === "delta") { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (hi - lo < 20) { const m = (hi + lo) / 2; lo = m - 10; hi = m + 10; }
    const padY = (hi - lo) * 0.08;
    lo -= padY; hi += padY;
    const step = niceStep(hi - lo, 5);
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;

    const pw = w - PAD.l - PAD.r, ph = h - PAD.t - PAD.b;
    const xOf = t => PAD.l + (t - t0) / spanMs * pw;
    const yOf = v => PAD.t + (hi - v) / (hi - lo) * ph;

    // Grid and axes (recessive)
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillStyle = cssVar("--text-muted");
    ctx.strokeStyle = cssVar("--grid");
    ctx.lineWidth = 1;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let v = lo; v <= hi + step / 2; v += step) {
      const y = Math.round(yOf(v)) + 0.5;
      ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(w - PAD.r, y); ctx.stroke();
      ctx.fillText(Math.round(v), PAD.l - 8, y);
    }
    if (ui.mode.value === "delta" && lo < 0 && hi > 0) {
      ctx.strokeStyle = cssVar("--text-muted");
      const y = Math.round(yOf(0)) + 0.5;
      ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(w - PAD.r, y); ctx.stroke();
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const secs = spanMs / 1000;
    const tStep = secs <= 10 ? 1 : secs <= 30 ? 5 : 10;
    for (let s = 0; s <= secs; s += tStep) {
      const x = xOf(now - s * 1000);
      ctx.fillText(s === 0 ? "now" : "-" + s + " s", x, h - PAD.b + 8);
    }

    // Lines, 2px
    ctx.save();
    ctx.beginPath(); ctx.rect(PAD.l, PAD.t, pw, ph); ctx.clip();
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    for (let i = 0; i < padCount; i++) {
      if (!visible[i]) continue;
      ctx.strokeStyle = seriesColor(i);
      ctx.beginPath();
      let started = false;
      for (const s of view) {
        const v = plotValue(s, i);
        if (v === null) { started = false; continue; }
        const x = xOf(s.t), y = yOf(v);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();

    // Crosshair and tooltip
    if (hoverX !== null && hoverX >= PAD.l && hoverX <= w - PAD.r && view.length) {
      const tHover = t0 + (hoverX - PAD.l) / pw * spanMs;
      let best = view[0];
      for (const s of view) if (Math.abs(s.t - tHover) < Math.abs(best.t - tHover)) best = s;
      const x = Math.round(xOf(best.t)) + 0.5;
      ctx.strokeStyle = cssVar("--text-muted");
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, PAD.t + ph); ctx.stroke();
      const ring = cssVar("--surface-1");
      let rows = "";
      for (let i = 0; i < padCount; i++) {
        if (!visible[i]) continue;
        const v = plotValue(best, i);
        if (v === null) continue;
        ctx.beginPath(); ctx.arc(x, yOf(v), 4, 0, Math.PI * 2);
        ctx.fillStyle = seriesColor(i); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = ring; ctx.stroke();
        const pressed = ((best.mask >> i) & 1) === 1;
        rows += '<div class="row"><span class="sw" style="background:' + seriesColor(i) + '"></span>Pad ' + padLabel(i) +
          ': ' + (ui.mode.value === "delta" ? signed(v) : v) + (pressed ? " (pressed)" : "") + '</div>';
      }
      ui.tip.innerHTML = '<div style="color:var(--text-muted)">' + ((now - best.t) / 1000).toFixed(2) +
        ' s ago</div>' + rows;
      ui.tip.style.display = rows ? "block" : "none";
      const tw = ui.tip.offsetWidth;
      ui.tip.style.left = (x + 12 + tw > w ? x - 12 - tw : x + 12) + "px";
      ui.tip.style.top = PAD.t + "px";
    } else {
      ui.tip.style.display = "none";
    }
    requestAnimationFrame(draw);
  }

  ui.wrap.addEventListener("mousemove", e => { hoverX = e.clientX - ui.wrap.getBoundingClientRect().left; });
  ui.wrap.addEventListener("mouseleave", () => { hoverX = null; });

  // ---- Controls
  ui.connect.addEventListener("click", () => port ? disconnect() : connect());
  ui.zero.addEventListener("click", () => {
    baseline.fill(null);
    baseAcc = { n: 0, sums: new Array(MAX_PADS).fill(0) };
    updatePads();
  });
  ui.record.addEventListener("click", () => {
    recording = !recording;
    if (recording) recorded = [];
    ui.record.textContent = recording ? "Stop" : "Record";
    ui.record.classList.toggle("active", recording);
    ui.save.disabled = recording || recorded.length === 0;
  });
  ui.save.addEventListener("click", () => {
    const head = ["time", "state_mask"];
    for (let i = 0; i < padCount; i++) head.push("pad_" + padLabel(i));
    const csv = [head.join(",")].concat(recorded.map(r => r.join(","))).join("\r\n") + "\r\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "mtouch_" + new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19) + ".csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  ui.pause.addEventListener("click", () => {
    paused = !paused;
    if (paused) pausedAt = performance.now();
    ui.pause.textContent = paused ? "Resume" : "Pause";
  });
  ui.mode.addEventListener("change", () => {
    ui.chartTitle.textContent = ui.mode.value === "raw" ? "Raw value" : "Delta from baseline";
  });
  ui.theme.addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    try { localStorage.setItem("mtouch-theme", dark ? "light" : "dark"); } catch (e) { }
    buildPads();
    updatePads();
  });
  try {
    const saved = localStorage.getItem("mtouch-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch (e) { }

  setInterval(() => {
    ui.rate.textContent = rateCount + " lines/s";
    ui.count.textContent = lineCount + " lines";
    ui.bad.textContent = badCount + " ignored";
    rateCount = 0;
  }, 1000);

  if (!("serial" in navigator)) {
    showNotice("This browser has no Web Serial. Open the page in Chrome or Edge (version 89 or later).");
    ui.connect.disabled = true;
  }
  if ("serial" in navigator) {
    navigator.serial.addEventListener("disconnect", e => { if (port && e.target === port) disconnect(); });
  }

  // The splash goes on the first click or key
  const splash = $("splash");
  function hideSplash() {
    splash.classList.add("gone");
    document.removeEventListener("keydown", hideSplash);
    setTimeout(() => splash.remove(), 400);
  }
  splash.addEventListener("click", hideSplash);
  document.addEventListener("keydown", hideSplash);

  buildPads();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
