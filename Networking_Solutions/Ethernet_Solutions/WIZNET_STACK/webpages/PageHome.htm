var R09_GCB_BYTE=32;

function A(l,v){return '<div class="r"><b>'+l+'</b><span class="b"><i style="width:'+Math.round(v/2.55)+'%"></i></span>'+("00"+v).slice(-3)+'</div>';}
function D(p,v,t){var h='',i;for(i=0;i<8;i++)h+='<div class="r"><b>'+p+i+'</b><span class="p'+((v>>i)&1?' on">ON':'">OFF')+'</span>'+(t?'<a href="/t'+i+'">Toggle</a>':'')+'</div>';return h;}

function Q(m){try{m=localStorage.au||m}catch(e){}if(m>0){AU=1;RU=1;setTimeout(G,2000,1);}}

N([R01_GCB_BYTE,R02_GCB_BYTE,R03_GCB_BYTE,R04_GCB_BYTE,R05_GCB_BYTE,R06_GCB_BYTE,R07_GCB_BYTE,R08_GCB_BYTE,R09_GCB_BYTE,R10_GCB_BYTE,R11_GCB_BYTE,R12_GCB_BYTE]);
